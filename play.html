<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Game Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d5dfc'/%3E%3C/svg%3E">
<style>
  :root { --bg: #0b0d14; --panel: #11141f; --card: #161a28; --btn: #1d2233; --line: #242a3d; --text: #eef0f7; --muted: #8e95ad; --accent: #6d5dfc; --green: #22c55e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 14px; background: rgba(17, 20, 31, .92); border-bottom: 1px solid var(--line); }
  #bar .home { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 6px 10px 6px 6px; border-radius: 10px; transition: background .15s, color .15s; }
  #bar .home:hover { background: var(--btn); color: var(--text); }
  #bar .home svg { width: 28px; height: 28px; }
  #title { flex: 1; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 12px; border-left: 1px solid var(--line); }
  #bar button { width: 38px; height: 38px; display: grid; place-items: center; background: var(--btn); color: var(--text); border: 0; border-radius: 10px; font-size: 16px; cursor: pointer; transition: background .15s; }
  #bar button:hover { background: #262c42; }
  #stage { flex: 1; position: relative; display: flex; overflow: hidden; align-items: center; justify-content: center; min-height: 0; padding: 12px;
    background: radial-gradient(80% 60% at 50% 0%, #161b2e 0%, var(--bg) 70%); }
  #game { background: #000; border-radius: 10px; outline: none; touch-action: none; box-shadow: 0 20px 60px rgba(0, 0, 0, .55), 0 0 0 1px var(--line); }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 20px; text-align: center; background: rgba(8, 10, 16, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: auto; }
  #overlay[hidden] { display: none; }
  #overlay > * { max-width: 460px; }
  #overlay h2 { margin: 0 0 6px; font-size: 32px; letter-spacing: -.02em; }
  #overlay p { margin: 4px 0; }
  #overlay .hint { color: var(--muted); font-size: 13px; }
  #overlay .controls { white-space: pre-line; color: #c9cee0; font-size: 14px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  #overlay a { color: #a99ffd; word-break: break-all; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; width: min(340px, 100%); }
  .btns button, .btn { height: 50px; background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 12px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: transform .1s, background .15s, filter .15s; }
  .btns button:hover, .btn:hover { background: #262c42; }
  .btns button:active { transform: scale(.98); }
  .btns button:first-child, .btn { background: var(--accent); border-color: transparent; color: #fff; }
  .btns button:first-child:hover { filter: brightness(1.12); background: var(--accent); }
  .code { font: 800 46px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .25em; padding: 14px 10px 14px 22px; border-radius: 14px; margin: 10px 0; background: var(--card); border: 1px solid var(--line); color: #fff; }
  #code { font: 700 28px/1 ui-monospace, "SF Mono", Menlo, monospace; text-align: center; letter-spacing: .3em; width: min(260px, 100%); height: 58px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); text-transform: uppercase; outline: none; margin-top: 8px; }
  #code:focus { border-color: var(--accent); }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; height: 170px; pointer-events: none; }
  #pad[hidden] { display: none; }
  #pad div { position: absolute; pointer-events: auto; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.22); backdrop-filter: blur(4px);
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; user-select: none; -webkit-user-select: none; }
  #pad div.on { background: rgba(109,93,252,.55); }
  #pad [data-k=up]    { left: 62px; bottom: 104px; width: 56px; height: 56px; border-radius: 14px; }
  #pad [data-k=down]  { left: 62px; bottom: 10px;  width: 56px; height: 56px; border-radius: 14px; }
  #pad [data-k=left]  { left: 10px; bottom: 57px;  width: 56px; height: 56px; border-radius: 14px; }
  #pad [data-k=right] { left: 114px; bottom: 57px; width: 56px; height: 56px; border-radius: 14px; }
  #pad [data-k=a]     { right: 20px; bottom: 30px; width: 76px; height: 76px; border-radius: 50%; }
  #pad [data-k=b]     { right: 110px; bottom: 70px; width: 60px; height: 60px; border-radius: 50%; font-size: 14px; }
  @media (max-width: 520px) { #bar .home span { display: none; } #overlay h2 { font-size: 26px; } }
</style>
</head>
<body>
<div id="bar">
  <a class="home" href="./"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#6d5dfc"/><path d="M18 26h28a8 8 0 0 1 8 8v4a6 6 0 0 1-11 3l-3-4H24l-3 4a6 6 0 0 1-11-3v-4a8 8 0 0 1 8-8z" fill="#fff"/><circle cx="42" cy="33" r="2.5" fill="#6d5dfc"/><path d="M20 33h8M24 29v8" stroke="#6d5dfc" stroke-width="3" stroke-linecap="round"/></svg><span>All games</span></a>
  <span id="title">Game Hub</span>
  <button id="mute" title="Sound">🔊</button>
  <button id="full" title="Fullscreen" aria-label="Fullscreen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="stage">
  <canvas id="game" tabindex="0"></canvas>
  <div id="overlay" hidden></div>
</div>
<div id="pad" hidden>
  <div data-k="up">▲</div><div data-k="down">▼</div><div data-k="left">◀</div><div data-k="right">▶</div>
  <div data-k="a">A</div><div data-k="b">B</div>
</div>
<script src="lib/peerjs.min.js"></script>
<script src="engine.js"></script>
</body>
</html>
