<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Game Hub</title>
<style>
  :root { --bg: #0f1117; --panel: #1a1d27; --btn: #2a2f3f; --text: #e8eaf0; --muted: #8b90a0; --accent: #5b8cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); }
  #bar a, #bar button { background: var(--btn); color: var(--text); border: 0; border-radius: 8px; padding: 6px 12px;
    font: inherit; cursor: pointer; text-decoration: none; }
  #title { flex: 1; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stage { flex: 1; position: relative; display: flex; overflow: hidden; align-items: center; justify-content: center; min-height: 0; padding: 8px; }
  #game { background: #000; border-radius: 6px; outline: none; touch-action: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 16px; text-align: center; background: rgba(10, 12, 18, .82); overflow: auto; }
  #overlay[hidden] { display: none; }
  #overlay h2 { margin: 0 0 4px; font-size: 30px; }
  #overlay p { margin: 4px 0; max-width: 520px; }
  #overlay .hint { color: var(--muted); font-size: 14px; }
  #overlay .controls { white-space: pre-line; color: #c7cbe0; }
  #overlay a { color: var(--accent); word-break: break-all; }
  .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; width: min(320px, 100%); }
  .btns button, .btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px; font: inherit;
    font-weight: 600; cursor: pointer; text-decoration: none; }
  .btns button + button { background: var(--btn); }
  .code { font-size: 44px; font-weight: 800; letter-spacing: 8px; background: var(--panel); padding: 8px 20px; border-radius: 12px; margin: 8px 0; }
  #code { font-size: 28px; text-align: center; letter-spacing: 6px; width: min(260px, 100%); padding: 10px; border-radius: 10px;
    border: 1px solid #3a4055; background: var(--panel); color: var(--text); text-transform: uppercase; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; height: 170px; pointer-events: none; }
  #pad[hidden] { display: none; }
  #pad div { position: absolute; pointer-events: auto; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.25);
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; user-select: none; -webkit-user-select: none; }
  #pad div.on { background: rgba(91,140,255,.5); }
  #pad [data-k=up]    { left: 62px; bottom: 104px; width: 56px; height: 56px; border-radius: 12px; }
  #pad [data-k=down]  { left: 62px; bottom: 10px;  width: 56px; height: 56px; border-radius: 12px; }
  #pad [data-k=left]  { left: 10px; bottom: 57px;  width: 56px; height: 56px; border-radius: 12px; }
  #pad [data-k=right] { left: 114px; bottom: 57px; width: 56px; height: 56px; border-radius: 12px; }
  #pad [data-k=a]     { right: 20px; bottom: 30px; width: 76px; height: 76px; border-radius: 50%; }
  #pad [data-k=b]     { right: 110px; bottom: 70px; width: 60px; height: 60px; border-radius: 50%; font-size: 15px; }
</style>
</head>
<body>
<div id="bar">
  <a href="index.html">← Games</a>
  <span id="title">Game Hub</span>
  <button id="mute" title="Sound">🔊</button>
  <button id="full" title="Fullscreen">⛶</button>
</div>
<div id="stage">
  <canvas id="game" tabindex="0"></canvas>
  <div id="overlay" hidden></div>
</div>
<div id="pad" hidden>
  <div data-k="up">▲</div><div data-k="down">▼</div><div data-k="left">◀</div><div data-k="right">▶</div>
  <div data-k="a">A</div><div data-k="b">B</div>
</div>
<script src="lib/peerjs.min.js"></script>
<script src="engine.js"></script>
</body>
</html>
