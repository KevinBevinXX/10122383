<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Hub</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card-hover: #242836; --text: #e8eaf0;
    --muted: #8b90a0; --accent: #5b8cff; --tag: #2a2f3f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 24px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  header p { margin: 0 0 16px; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select { background: var(--card); color: var(--text); border: 1px solid #2d3242;
    border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  input { flex: 1; min-width: 180px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .game { background: var(--card); border: 0; border-radius: 12px; padding: 16px; color: var(--text);
    text-align: left; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 8px;
    transition: background .15s, transform .15s; }
  .game:hover { background: var(--card-hover); transform: translateY(-2px); }
  .emoji { font-size: 36px; }
  .name { font-weight: 600; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .meta span { background: var(--tag); padding: 2px 8px; border-radius: 99px; }
  #player { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
  #player.open { display: flex; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card); }
  #bar strong { flex: 1; }
  #bar button { background: var(--tag); color: var(--text); border: 0; border-radius: 8px;
    padding: 8px 12px; font: inherit; cursor: pointer; text-decoration: none; }
  #frame { flex: 1; border: 0; width: 100%; background: #000; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 16px; }
</style>
</head>
<body>
<header>
  <h1>🎮 Game Hub</h1>
  <p>Popular web games in one place. Click a game to play.</p>
  <div class="controls">
    <input id="search" type="search" placeholder="Search games…" autocomplete="off">
    <select id="cat"><option value="">All categories</option></select>
  </div>
</header>

<main id="grid"></main>

<div id="player">
  <div id="bar">
    <button id="close">← Back</button>
    <strong id="title"></strong>
    <button id="fs">Fullscreen</button>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen></iframe>
</div>

<footer>Every game belongs to its developer. Games are loaded from their official sites or GameDistribution.</footer>

<script>
const GAMES = [
  { name: "Krunker", emoji: "🔫", cat: "Shooter", url: "https://krunker.io" },
  { name: "Shell Shockers", emoji: "🥚", cat: "Shooter", url: "https://shellshock.io" },
  { name: "Venge.io", emoji: "💥", cat: "Shooter", url: "https://venge.io" },
  { name: "ZombsRoyale", emoji: "🧟", cat: "Shooter", url: "https://zombsroyale.io" },
  { name: "Smash Karts", emoji: "🏎️", cat: "Racing", url: "https://smashkarts.io" },
  { name: "Moto X3M Winter", emoji: "🏍️", cat: "Racing", url: "https://html5.gamedistribution.com/bcacf81441bd4c7799a622171116ea9d/" },
  { name: "Moto X3M Pool Party", emoji: "🏊", cat: "Racing", url: "https://html5.gamedistribution.com/f804d079d19f44d3b951ead4588e974a/" },
  { name: "Moto X3M Spooky Land", emoji: "🎃", cat: "Racing", url: "https://html5.gamedistribution.com/b8a342904608470a9f3382337aca3558/" },
  { name: "Eggy Car", emoji: "🥚", cat: "Racing", url: "https://html5.gamedistribution.com/59a98bf799ef499d9d7b9285bccaa196/" },
  { name: "Snow Rider 3D", emoji: "🛷", cat: "Racing", url: "https://html5.gamedistribution.com/3b79a8537ebc414fb4f9672a9b8c68c8/" },
  { name: "Basket Random", emoji: "🏀", cat: "Sports", url: "https://html5.gamedistribution.com/bf1268dccb5d43e7970bb3edaa54afc8/" },
  { name: "8 Ball Pro", emoji: "🎱", cat: "Sports", url: "https://html5.gamedistribution.com/20fa5406b00643128250478502fa5453/" },
  { name: "Slither.io", emoji: "🐍", cat: ".io", url: "https://slither.io" },
  { name: "Diep.io", emoji: "🔵", cat: ".io", url: "https://diep.io" },
  { name: "Paper.io 2", emoji: "📄", cat: ".io", url: "https://paper-io.com" },
  { name: "Hole.io", emoji: "🕳️", cat: ".io", url: "https://hole-io.com" },
  { name: "MooMoo.io", emoji: "🐄", cat: ".io", url: "https://moomoo.io" },
  { name: "Territorial.io", emoji: "🗺️", cat: ".io", url: "https://territorial.io" },
  { name: "Bloxd.io", emoji: "🧱", cat: "Sandbox", url: "https://bloxd.io" },
  { name: "Minecraft Classic", emoji: "⛏️", cat: "Sandbox", url: "https://classic.minecraft.net" },
  { name: "Vex 3", emoji: "🏃", cat: "Arcade", url: "https://html5.gamedistribution.com/762c932b4db74c6da0c1d101b2da8be6/" },
  { name: "Vex 9", emoji: "🦘", cat: "Arcade", url: "https://html5.gamedistribution.com/8d034584a63642dcb89fa3d24ed6e1b1/" },
  { name: "Fireboy & Watergirl 1", emoji: "🔥", cat: "Puzzle", url: "https://html5.gamedistribution.com/a55c9cc9c21e4fc683c8c6857f3d0c75/" },
  { name: "Fireboy & Watergirl 2", emoji: "💡", cat: "Puzzle", url: "https://html5.gamedistribution.com/383ad09b92c7446b9113cccc29630517/" },
  { name: "Fireboy & Watergirl 3", emoji: "🧊", cat: "Puzzle", url: "https://html5.gamedistribution.com/f3a6e1ac0a77412289cbac47658b2b68/" },
  { name: "Fireboy & Watergirl 5", emoji: "🌊", cat: "Puzzle", url: "https://html5.gamedistribution.com/03f124074b0049f89fdace0cacf8ead5/" },
  { name: "2048", emoji: "🔢", cat: "Puzzle", url: "https://html5.gamedistribution.com/713d172e6d9645bab2407c23afb038c8/" },
  { name: "Tetris", emoji: "🟪", cat: "Puzzle", url: "https://tetris.com/play-tetris" },
  { name: "Little Alchemy 2", emoji: "⚗️", cat: "Puzzle", url: "https://littlealchemy2.com" },
  { name: "Skribbl.io", emoji: "✏️", cat: "Party", url: "https://skribbl.io" },
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const cat = document.getElementById("cat");
const player = document.getElementById("player");
const frame = document.getElementById("frame");

[...new Set(GAMES.map(g => g.cat))].sort().forEach(c => cat.add(new Option(c, c)));

function render() {
  const q = search.value.trim().toLowerCase();
  grid.innerHTML = "";
  GAMES.filter(g => (!cat.value || g.cat === cat.value) && g.name.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach(g => {
      const b = document.createElement("button");
      b.className = "game";
      b.innerHTML = `<div class="emoji">${g.emoji}</div><div class="name"></div>
        <div class="meta"><span>${g.cat}</span></div>`;
      b.querySelector(".name").textContent = g.name;
      b.onclick = () => play(g);
      grid.appendChild(b);
    });
}

function play(g) {
  document.getElementById("title").textContent = g.name;
  frame.src = g.url;
  player.classList.add("open");
}

document.getElementById("close").onclick = () => { frame.src = "about:blank"; player.classList.remove("open"); };
document.getElementById("fs").onclick = () => frame.requestFullscreen?.();
search.oninput = render;
cat.onchange = render;
render();
</script>
</body>
</html>
