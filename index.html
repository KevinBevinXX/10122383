<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Hub</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card-hover: #242836; --text: #e8eaf0;
    --muted: #8b90a0; --accent: #5b8cff; --tag: #2a2f3f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 24px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  header p { margin: 0 0 16px; color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select { background: var(--card); color: var(--text); border: 1px solid #2d3242;
    border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  input { flex: 1; min-width: 180px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .game { background: var(--card); border: 0; border-radius: 12px; padding: 16px; color: var(--text);
    text-align: left; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 8px;
    transition: background .15s, transform .15s; }
  .game:hover { background: var(--card-hover); transform: translateY(-2px); }
  .emoji { font-size: 36px; }
  .name { font-weight: 600; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .meta span { background: var(--tag); padding: 2px 8px; border-radius: 99px; }
  #player { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
  #player.open { display: flex; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card); }
  #bar strong { flex: 1; }
  #bar button, #bar a { background: var(--tag); color: var(--text); border: 0; border-radius: 8px;
    padding: 8px 12px; font: inherit; cursor: pointer; text-decoration: none; }
  #frame { flex: 1; border: 0; width: 100%; background: #000; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 16px; }
</style>
</head>
<body>
<header>
  <h1>🎮 Game Hub</h1>
  <p>Popular web games in one place. Games marked ↗ open on their official site in a new tab.</p>
  <div class="controls">
    <input id="search" type="search" placeholder="Search games…" autocomplete="off">
    <select id="cat"><option value="">All categories</option></select>
  </div>
</header>

<main id="grid"></main>

<div id="player">
  <div id="bar">
    <button id="close">← Back</button>
    <strong id="title"></strong>
    <button id="fs">Fullscreen</button>
    <a id="newtab" target="_blank" rel="noopener">Open in new tab ↗</a>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen></iframe>
</div>

<footer>Every game belongs to its developer and is played from its official site.</footer>

<script>
// embed: true = the site allows being shown in a frame; false = it blocks that, so open a new tab.
const GAMES = [
  { name: "Basket Bros",        emoji: "🏀", cat: "Sports",   url: "https://basketbros.io",   embed: false },
  { name: "Football Bros",      emoji: "🏈", cat: "Sports",   url: "https://footballbros.io", embed: false },
  { name: "Retro Bowl",         emoji: "🏟️", cat: "Sports",   url: "https://poki.com/en/g/retro-bowl", embed: false },
  { name: "Krunker",            emoji: "🔫", cat: "Shooter",  url: "https://krunker.io",      embed: true },
  { name: "Shell Shockers",     emoji: "🥚", cat: "Shooter",  url: "https://shellshock.io",   embed: true },
  { name: "Venge.io",           emoji: "💥", cat: "Shooter",  url: "https://venge.io",        embed: true },
  { name: "ZombsRoyale",        emoji: "🧟", cat: "Shooter",  url: "https://zombsroyale.io",  embed: true },
  { name: "1v1.LOL",            emoji: "🏗️", cat: "Shooter",  url: "https://1v1.lol",         embed: false },
  { name: "Smash Karts",        emoji: "🏎️", cat: "Racing",   url: "https://smashkarts.io",   embed: true },
  { name: "Drift Hunters",      emoji: "🚗", cat: "Racing",   url: "https://www.crazygames.com/game/drift-hunters", embed: false },
  { name: "Moto X3M",           emoji: "🏍️", cat: "Racing",   url: "https://poki.com/en/g/moto-x3m", embed: false },
  { name: "Drive Mad",          emoji: "🚙", cat: "Racing",   url: "https://poki.com/en/g/drive-mad", embed: false },
  { name: "Slither.io",         emoji: "🐍", cat: ".io",      url: "https://slither.io",      embed: true },
  { name: "Agar.io",            emoji: "🟢", cat: ".io",      url: "https://agar.io",         embed: false },
  { name: "Diep.io",            emoji: "🔵", cat: ".io",      url: "https://diep.io",         embed: true },
  { name: "Paper.io 2",         emoji: "📄", cat: ".io",      url: "https://paper-io.com",    embed: true },
  { name: "Hole.io",            emoji: "🕳️", cat: ".io",      url: "https://hole-io.com",     embed: true },
  { name: "MooMoo.io",          emoji: "🐄", cat: ".io",      url: "https://moomoo.io",       embed: false },
  { name: "Territorial.io",     emoji: "🗺️", cat: ".io",      url: "https://territorial.io",  embed: true },
  { name: "Bloxd.io",           emoji: "🧱", cat: "Sandbox",  url: "https://bloxd.io",        embed: true },
  { name: "Minecraft Classic",  emoji: "⛏️", cat: "Sandbox",  url: "https://classic.minecraft.net", embed: true },
  { name: "Slope",              emoji: "⚪", cat: "Arcade",   url: "https://www.crazygames.com/game/slope", embed: false },
  { name: "Subway Surfers",     emoji: "🛹", cat: "Arcade",   url: "https://poki.com/en/g/subway-surfers", embed: false },
  { name: "Temple Run 2",       emoji: "🏃", cat: "Arcade",   url: "https://poki.com/en/g/temple-run-2", embed: false },
  { name: "Stickman Hook",      emoji: "🪝", cat: "Arcade",   url: "https://poki.com/en/g/stickman-hook", embed: false },
  { name: "Run 3",              emoji: "🚀", cat: "Arcade",   url: "https://www.coolmathgames.com/0-run-3", embed: false },
  { name: "Level Devil",        emoji: "😈", cat: "Arcade",   url: "https://poki.com/en/g/level-devil", embed: false },
  { name: "Fireboy & Watergirl",emoji: "🔥", cat: "Puzzle",   url: "https://www.coolmathgames.com/0-fireboy-and-water-girl-in-the-forest-temple", embed: false },
  { name: "2048",               emoji: "🔢", cat: "Puzzle",   url: "https://play2048.co",     embed: false },
  { name: "Tetris",             emoji: "🟪", cat: "Puzzle",   url: "https://tetris.com/play-tetris", embed: true },
  { name: "Wordle",             emoji: "🟩", cat: "Puzzle",   url: "https://www.nytimes.com/games/wordle/index.html", embed: false },
  { name: "Little Alchemy 2",   emoji: "⚗️", cat: "Puzzle",   url: "https://littlealchemy2.com", embed: true },
  { name: "Chess",              emoji: "♟️", cat: "Puzzle",   url: "https://www.chess.com/play/computer", embed: false },
  { name: "GeoGuessr",          emoji: "🌍", cat: "Puzzle",   url: "https://www.geoguessr.com", embed: false },
  { name: "Papa's Freezeria",   emoji: "🍦", cat: "Casual",   url: "https://www.coolmathgames.com/0-papas-freezeria", embed: false },
  { name: "Cookie Clicker",     emoji: "🍪", cat: "Casual",   url: "https://orteil.dashnet.org/cookieclicker/", embed: false },
  { name: "Skribbl.io",         emoji: "✏️", cat: "Party",    url: "https://skribbl.io",      embed: true },
  { name: "Gartic Phone",       emoji: "📞", cat: "Party",    url: "https://garticphone.com", embed: false },
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const cat = document.getElementById("cat");
const player = document.getElementById("player");
const frame = document.getElementById("frame");

[...new Set(GAMES.map(g => g.cat))].sort().forEach(c => cat.add(new Option(c, c)));

function render() {
  const q = search.value.trim().toLowerCase();
  grid.innerHTML = "";
  GAMES.filter(g => (!cat.value || g.cat === cat.value) && g.name.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name))
    .forEach(g => {
      const b = document.createElement("button");
      b.className = "game";
      b.innerHTML = `<div class="emoji">${g.emoji}</div><div class="name"></div>
        <div class="meta"><span>${g.cat}</span><span>${g.embed ? "Play here" : "↗ New tab"}</span></div>`;
      b.querySelector(".name").textContent = g.name;
      b.onclick = () => play(g);
      grid.appendChild(b);
    });
}

function play(g) {
  if (!g.embed) { window.open(g.url, "_blank", "noopener"); return; }
  document.getElementById("title").textContent = g.name;
  document.getElementById("newtab").href = g.url;
  frame.src = g.url;
  player.classList.add("open");
}

document.getElementById("close").onclick = () => { frame.src = "about:blank"; player.classList.remove("open"); };
document.getElementById("fs").onclick = () => frame.requestFullscreen?.();
search.oninput = render;
cat.onchange = render;
render();
</script>
</body>
</html>
